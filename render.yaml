services:
  - type: web
    name: basejungle-bot
    env: node
    plan: starter
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: RPC_URL
        fromGroup: basejungle-secrets
      - key: KEEPER_PRIVATE_KEY
        fromGroup: basejungle-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: basejungle-db
          property: connectionString
      - key: REFERRAL_MANAGER_ADDRESS
        fromGroup: basejungle-secrets
      - key: STRATEGY_CONTROLLER_ADDRESS
        fromGroup: basejungle-secrets
      - key: REBALANCE_KEEPER_INTERVAL
        value: 120000
      - key: LEVERAGE_MANAGER_ADDRESS
        fromGroup: basejungle-secrets

databases:
  - name: basejungle-db
    databaseName: basejungle
    user: basejungle